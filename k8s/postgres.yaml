# ==========================================================
# PostgreSQL-Datenbank für MiniERP
# Persistent Storage + Deployment + interner Service
# ==========================================================


# Dauerhafter Speicher für PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-data
  namespace: minierp

spec:
  # Speicher darf von einem Node schreibend eingebunden werden
  accessModes:
    - ReadWriteOnce

  # Angeforderte Speicherkapazität
  resources:
    requests:
      storage: 1Gi


---

# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: db
  namespace: minierp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: postgres

          # PostgreSQL-Container
          image: postgres:18-alpine

          ports:
            - containerPort: 5432

          # Datenbankname und Zugangsdaten aus Kubernetes Secret
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_PASSWORD

          # Dauerhaften Speicher in PostgreSQL einbinden
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

          # Prüft, ob PostgreSQL Anfragen annehmen kann
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 5
            periodSeconds: 5

          # Prüft, ob PostgreSQL noch funktionsfähig ist
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 15
            periodSeconds: 10

      # Verknüpft den Pod mit dem PersistentVolumeClaim
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data


---

# Interner Netzwerk-Service für PostgreSQL
apiVersion: v1
kind: Service

metadata:
  name: db
  namespace: minierp

spec:
  selector:
    app: db

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP
