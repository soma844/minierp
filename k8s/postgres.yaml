apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: minierp

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: minierp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: postgres

          image: postgres:18-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minierp-db-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: postgres-storage

          persistentVolumeClaim:
            claimName: postgres-data


---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: minierp

spec:
  selector:
    app: db

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP