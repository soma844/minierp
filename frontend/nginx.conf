# ==========================================================
# MiniERP Frontend - Nginx-Konfiguration
#
# Aufgaben:
# 1. Auslieferung des gebauten Vue/Vite-Frontends
# 2. Weiterleitung von /api-Anfragen an das Backend
# ==========================================================

server {

    # Nginx lauscht innerhalb des Containers auf HTTP-Port 80.
    listen 80;

    # Akzeptiert beliebige Hostnamen.
    server_name _;

    # Verzeichnis, in das der Docker-Build
    # das fertige Vue-Frontend kopiert.
    root /usr/share/nginx/html;

    # Standarddatei, die bei einem Verzeichnisaufruf
    # ausgeliefert wird.
    index index.html;


    # ------------------------------------------------------
    # Vue Single Page Application
    # ------------------------------------------------------

    location / {

        /*
         * Zuerst versucht Nginx, eine echte Datei
         * oder ein echtes Verzeichnis zu finden.
         *
         * Falls nichts existiert, wird index.html geliefert.
         */
        try_files $uri $uri/ /index.html;

    }


    # ------------------------------------------------------
    # Backend API
    # ------------------------------------------------------

    location /api/ {

        /*
         * Alle Requests unter /api/
         * werden an den Backend-Container weitergeleitet.
         *
         * "backend" ist dabei typischerweise der
         * Service-Name aus docker-compose.yml.
         *
         * Beispiel:
         *
         * Browser:
         * /api/kunden
         *
         * Nginx:
         * http://backend:8080/api/kunden
         */
        proxy_pass http://backend:8080;

        # HTTP/1.1 für die Verbindung zum Backend verwenden.
        proxy_http_version 1.1;

        # Ursprünglichen Host-Header weitergeben.
        proxy_set_header Host $host;

        # Tatsächliche Client-IP an das Backend weiterreichen.
        proxy_set_header X-Real-IP $remote_addr;

        # Weiterleitungskette der Client-IP-Adressen erhalten.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ursprüngliches Protokoll weitergeben,
        # zum Beispiel http oder https.
        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
