# MiniERP lokale Docker-Umgebung:
# PostgreSQL + Spring Boot Backend + Vue/Nginx Frontend

services:

  # PostgreSQL-Datenbank
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: minierp
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U minierp -d minierp
      interval: 5s
      timeout: 5s
      retries: 10


  # Spring-Boot-Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minierp
      SPRING_DATASOURCE_USERNAME: minierp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"


  # Vue-Frontend über Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      - backend

    ports:
      - "8081:80"


# Persistenter Speicher für PostgreSQL
volumes:
  postgres_data:
