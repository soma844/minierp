# MiniERP CI/CD Pipeline:
# Tests -> Build -> Docker Images -> E2E-Test

stages:
  - test
  - build
  - image
  - e2e


# ----------------------------------------------------------
# Backend Unit-/Integrationstests
# ----------------------------------------------------------

backend-test:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21

  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/

  script:
    - mvn --batch-mode test


# ----------------------------------------------------------
# Frontend Tests
# ----------------------------------------------------------

frontend-test:
  stage: test
  image: node:22-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run test:run


# ----------------------------------------------------------
# Frontend Produktionsbuild
# ----------------------------------------------------------

frontend-build:
  stage: build
  image: node:22-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run build

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week


# ----------------------------------------------------------
# Backend- und Frontend-Docker-Images
# ----------------------------------------------------------

docker-images:
  stage: image
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    # Commit-spezifische Images bauen und veröffentlichen
    - docker build --pull -t "$BACKEND_IMAGE" .
    - docker push "$BACKEND_IMAGE"

    - docker build --pull -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"

    # Default-Branch zusätzlich als latest markieren
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$BACKEND_IMAGE" "$CI_REGISTRY_IMAGE/backend:latest"
        docker push "$CI_REGISTRY_IMAGE/backend:latest"

        docker tag "$FRONTEND_IMAGE" "$CI_REGISTRY_IMAGE/frontend:latest"
        docker push "$CI_REGISTRY_IMAGE/frontend:latest"
      fi

  rules:
    - if: '$CI_COMMIT_BRANCH'


# ----------------------------------------------------------
# Vollständiger E2E-Test mit PostgreSQL, Backend,
# Frontend und Playwright
# ----------------------------------------------------------

playwright-e2e:
  stage: e2e
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  needs:
    - docker-images

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    PLAYWRIGHT_IMAGE: "minierp-playwright:$CI_COMMIT_SHORT_SHA"

  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    # Commit-Diagnose
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
    - echo "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"

    - |
      echo "E2E-Test im GitLab-Checkout:"
      grep -nE \
        "K-90001|K-E2E|LK-90001|LK-E2E|AUF-90001|AUF-E2E|PROD-90001|PROD-E2E" \
        frontend/e2e/minierp.spec.ts

    # Gemeinsames Netzwerk für den Test-Stack
    - docker network create minierp-e2e

    # PostgreSQL starten
    - >
      docker run -d
      --name db
      --network minierp-e2e
      -e POSTGRES_DB=minierp
      -e POSTGRES_USER=minierp
      -e POSTGRES_PASSWORD=e2e_password
      postgres:18-alpine

    # Auf PostgreSQL warten
    - |
      DB_READY=false

      for i in $(seq 1 30); do
        if docker exec db pg_isready -U minierp -d minierp; then
          echo "PostgreSQL ist bereit."
          DB_READY=true
          break
        fi

        echo "Warte auf PostgreSQL... Versuch $i/30"
        sleep 2
      done

      if [ "$DB_READY" != "true" ]; then
        echo "FEHLER: PostgreSQL wurde nicht rechtzeitig bereit."
        docker logs db || true
        exit 1
      fi

    # Backend starten
    - >
      docker run -d
      --name backend
      --network minierp-e2e
      -e SPRING_PROFILES_ACTIVE=dev
      -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/minierp
      -e SPRING_DATASOURCE_USERNAME=minierp
      -e SPRING_DATASOURCE_PASSWORD=e2e_password
      -e SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      -e SPRING_FLYWAY_ENABLED=true
      "$BACKEND_IMAGE"

    # Auf Spring Boot warten
    - |
      BACKEND_READY=false

      for i in $(seq 1 30); do
        if docker logs backend 2>&1 | grep -q "Started MinierpApplication"; then
          echo "Backend ist bereit."
          BACKEND_READY=true
          break
        fi

        if [ "$(docker inspect -f '{{.State.Running}}' backend 2>/dev/null)" != "true" ]; then
          echo "FEHLER: Backend-Container wurde beendet."
          docker logs backend || true
          exit 1
        fi

        echo "Warte auf Backend... Versuch $i/30"
        sleep 2
      done

      if [ "$BACKEND_READY" != "true" ]; then
        echo "FEHLER: Backend wurde nicht rechtzeitig bereit."
        docker logs backend || true
        exit 1
      fi

    # Frontend/Nginx starten
    - >
      docker run -d
      --name frontend
      --network minierp-e2e
      "$FRONTEND_IMAGE"

    # Auf Frontend warten
    - |
      FRONTEND_READY=false

      for i in $(seq 1 30); do
        if docker exec frontend sh -c \
          'wget -q -O /dev/null http://127.0.0.1/'; then
          echo "Frontend ist bereit."
          FRONTEND_READY=true
          break
        fi

        if [ "$(docker inspect -f '{{.State.Running}}' frontend 2>/dev/null)" != "true" ]; then
          echo "FEHLER: Frontend-Container wurde beendet."
          docker logs frontend || true
          exit 1
        fi

        echo "Warte auf Frontend... Versuch $i/30"
        sleep 2
      done

      if [ "$FRONTEND_READY" != "true" ]; then
        echo "FEHLER: Frontend wurde nicht rechtzeitig bereit."
        docker logs frontend || true
        exit 1
      fi

    # Temporäres Playwright-Testimage erstellen
    - |
      cat > frontend/Dockerfile.e2e <<'EOF'
      FROM mcr.microsoft.com/playwright:v1.63.0-noble

      WORKDIR /app

      COPY package.json package-lock.json ./
      RUN npm ci

      COPY . .

      CMD ["npx", "playwright", "test"]
      EOF

    - docker pull mcr.microsoft.com/playwright:v1.63.0-noble

    - >
      docker build
      --pull
      --no-cache
      -f frontend/Dockerfile.e2e
      -t "$PLAYWRIGHT_IMAGE"
      ./frontend

    # Diagnose des Testcontainers
    - docker run --rm "$PLAYWRIGHT_IMAGE" npx playwright --version

    - |
      echo "E2E-Test im Playwright-Container:"
      docker run --rm "$PLAYWRIGHT_IMAGE" sh -lc \
        'grep -nE "K-90001|K-E2E|LK-90001|LK-E2E|AUF-90001|AUF-E2E|PROD-90001|PROD-E2E" /app/e2e/minierp.spec.ts'

    # E2E-Test gegen den vollständigen Stack
    - >
      docker run
      --rm
      --network minierp-e2e
      -e PLAYWRIGHT_BASE_URL=http://frontend
      "$PLAYWRIGHT_IMAGE"

  # Testumgebung immer aufräumen
  after_script:
    - docker logs backend || true
    - docker logs frontend || true
    - docker logs db || true
    - docker rm -f frontend backend db || true
    - docker network rm minierp-e2e || true

  rules:
    - if: '$CI_COMMIT_BRANCH'
