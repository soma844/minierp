playwright-e2e:
  stage: e2e
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  needs:
    - docker-images

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    PLAYWRIGHT_IMAGE: "minierp-playwright:$CI_COMMIT_SHORT_SHA"

  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    # ---------------------------------------------------------
    # Diagnose: Welcher Commit und welcher E2E-Test liegt vor?
    # ---------------------------------------------------------
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
    - echo "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"

    - echo "E2E-Test im GitLab-Checkout:"
    - >
      grep -nE
      "K-90001|K-E2E|LK-90001|LK-E2E|AUF-90001|AUF-E2E|PROD-90001|PROD-E2E"
      frontend/e2e/minierp.spec.ts

    # ---------------------------------------------------------
    # Gemeinsames Docker-Netz
    # ---------------------------------------------------------
    - docker network create minierp-e2e

    # ---------------------------------------------------------
    # PostgreSQL
    # ---------------------------------------------------------
    - >
      docker run -d
      --name db
      --network minierp-e2e
      -e POSTGRES_DB=minierp
      -e POSTGRES_USER=minierp
      -e POSTGRES_PASSWORD=e2e_password
      postgres:18-alpine

    # Auf PostgreSQL warten
    - |
      DB_READY=false

      for i in $(seq 1 30); do
        if docker exec db pg_isready -U minierp -d minierp; then
          echo "PostgreSQL ist bereit."
          DB_READY=true
          break
        fi

        echo "Warte auf PostgreSQL... Versuch $i/30"
        sleep 2
      done

      if [ "$DB_READY" != "true" ]; then
        echo "FEHLER: PostgreSQL wurde nicht rechtzeitig bereit."
        exit 1
      fi

    # ---------------------------------------------------------
    # Backend
    # ---------------------------------------------------------
    - >
      docker run -d
      --name backend
      --network minierp-e2e
      -e SPRING_PROFILES_ACTIVE=dev
      -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/minierp
      -e SPRING_DATASOURCE_USERNAME=minierp
      -e SPRING_DATASOURCE_PASSWORD=e2e_password
      -e SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      -e SPRING_FLYWAY_ENABLED=true
      "$BACKEND_IMAGE"

    # Auf Backend warten
    - |
      BACKEND_READY=false

      for i in $(seq 1 30); do
        if docker logs backend 2>&1 | grep -q "Started MinierpApplication"; then
          echo "Backend ist bereit."
          BACKEND_READY=true
          break
        fi

        echo "Warte auf Backend... Versuch $i/30"
        sleep 2
      done

      if [ "$BACKEND_READY" != "true" ]; then
        echo "FEHLER: Backend wurde nicht rechtzeitig bereit."
        docker logs backend || true
        exit 1
      fi

    # ---------------------------------------------------------
    # Frontend
    # ---------------------------------------------------------
    - >
      docker run -d
      --name frontend
      --network minierp-e2e
      "$FRONTEND_IMAGE"

    - sleep 3

    # ---------------------------------------------------------
    # Playwright-Testimage
    # ---------------------------------------------------------
    - |
      cat > frontend/Dockerfile.e2e <<'EOF'
      FROM mcr.microsoft.com/playwright:v1.63.0-noble

      WORKDIR /app

      COPY package.json package-lock.json ./
      RUN npm ci

      COPY . .

      CMD ["npx", "playwright", "test"]
      EOF

    # Basisimage ausdrücklich aktualisieren
    - docker pull mcr.microsoft.com/playwright:v1.63.0-noble

    # Testimage mit Commit-spezifischem Tag neu bauen
    - >
      docker build
      --pull
      --no-cache
      -f frontend/Dockerfile.e2e
      -t "$PLAYWRIGHT_IMAGE"
      ./frontend

    # ---------------------------------------------------------
    # Diagnose IM gebauten Container
    # ---------------------------------------------------------
    - docker run --rm "$PLAYWRIGHT_IMAGE" npx playwright --version

    - echo "E2E-Test IM Playwright-Container:"
    - >
      docker run --rm
      "$PLAYWRIGHT_IMAGE"
      sh -lc
      'grep -nE "K-90001|K-E2E|LK-90001|LK-E2E|AUF-90001|AUF-E2E|PROD-90001|PROD-E2E" /app/e2e/minierp.spec.ts'

    # ---------------------------------------------------------
    # Browser-E2E
    # ---------------------------------------------------------
    - >
      docker run
      --rm
      --network minierp-e2e
      -e PLAYWRIGHT_BASE_URL=http://frontend
      "$PLAYWRIGHT_IMAGE"

  after_script:
    - docker logs backend || true
    - docker logs frontend || true
    - docker logs db || true
    - docker rm -f frontend backend db || true
    - docker network rm minierp-e2e || true

  rules:
    - if: '$CI_COMMIT_BRANCH'