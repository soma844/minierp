stages:
  - test
  - build
  - image


# =========================================================
# BACKEND TESTS
# =========================================================

backend-test:
  stage: test

  image: maven:3.9.11-eclipse-temurin-21

  variables:
    MAVEN_OPTS: >
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/

  script:
    - mvn --batch-mode test


# =========================================================
# FRONTEND TESTS
# =========================================================

frontend-test:
  stage: test

  image: node:22-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run test:run


# =========================================================
# FRONTEND PRODUCTION BUILD
# =========================================================

frontend-build:
  stage: build

  image: node:22-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run build

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week


# =========================================================
# DOCKER IMAGES + GITLAB CONTAINER REGISTRY
# =========================================================

docker-images:
  stage: image

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

    BACKEND_IMAGE:
      $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

    FRONTEND_IMAGE:
      $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

  before_script:
    - docker info

    - >
      echo "$CI_REGISTRY_PASSWORD"
      | docker login
      -u "$CI_REGISTRY_USER"
      --password-stdin
      "$CI_REGISTRY"

  script:

    # Backend
    - docker build
      -t "$BACKEND_IMAGE"
      .

    - docker push "$BACKEND_IMAGE"


    # Frontend
    - docker build
      -t "$FRONTEND_IMAGE"
      ./frontend

    - docker push "$FRONTEND_IMAGE"


    # main bekommt zusätzlich latest
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then

        docker tag \
          "$BACKEND_IMAGE" \
          "$CI_REGISTRY_IMAGE/backend:latest"

        docker push \
          "$CI_REGISTRY_IMAGE/backend:latest"


        docker tag \
          "$FRONTEND_IMAGE" \
          "$CI_REGISTRY_IMAGE/frontend:latest"

        docker push \
          "$CI_REGISTRY_IMAGE/frontend:latest"

      fi

  rules:
    - if: $CI_COMMIT_BRANCH